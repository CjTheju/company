<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FXPERTS</title>
  <link rel="icon" href="white-logo.png" type="image/png">

  <style>
    :root {
      --gold: #f7b500;
      --dark: #000000;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      background: var(--dark);
      overflow: hidden;
      font-family: 'Poppins', 'Inter', sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: var(--dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      padding: 10px;
      text-align: center;
    }

    /* Ring wrapper for responsive alignment */
    .loader-ring-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: clamp(130px, 40vw, 180px);
      height: clamp(130px, 40vw, 180px);
    }

    .loader-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: var(--gold);
      border-right-color: var(--gold);
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
      box-shadow: 0 0 60px rgba(247, 181, 0, 0.7);
    }

    /* Logo centered inside ring */
    .loader-logo {
      width: 50%;
      max-width: 110px;
      z-index: 10;
      filter: drop-shadow(0 0 35px rgba(247, 181, 0, 0.8));
      animation: logoFloat 2s infinite alternate ease-in-out;
    }

    /* Loading Text stays below */
    .load-text {
      margin-top: 28px;
      font-size: clamp(12px, 4vw, 18px);
      font-weight: 500;
      letter-spacing: clamp(6px, 2.5vw, 14px);
      color: #fff;
      text-transform: uppercase;
      opacity: 0.85;
      white-space: nowrap;
      animation: textPulse 2s infinite alternate;
    }

    /* Exit Animations */
    .exit-logo {
      transition: transform 0.9s ease, opacity 0.9s ease;
      transform: translateY(-120px) scale(1.2);
      opacity: 0;
    }

    .exit-loader {
      transition: opacity 0.9s ease;
      opacity: 0;
    }

    /* Animations */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes logoFloat {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-8px) scale(1.05); }
    }

    @keyframes textPulse {
      from { opacity: 0.6; text-shadow: 0 0 15px var(--gold); }
      to   { opacity: 1;   text-shadow: 0 0 35px var(--gold); }
    }

  </style>
</head>

<body>

  <div id="loader">
    <div class="loader-ring-wrapper">
      <div class="loader-ring"></div>
      <img src="white logo.png" class="loader-logo" alt="FXPERTS Logo">
    </div>
    <div class="load-text">Loading...</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById('loader');
      const logo = loader.querySelector('.loader-logo');

      // Show loader for 3 seconds
      setTimeout(() => {
        // Animate logo up + fade
        logo.classList.add('exit-logo');

        // Fade out loader background
        loader.classList.add('exit-loader');

        // Redirect after animation
        setTimeout(() => {
          window.location.href = "Page.html"; // Replace with your main page
        }, 900); // match transition duration
      }, 3000); // loader visible duration
    });
  </script>

</body>
</html>
