<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    /* Fullscreen Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: #000000; /* PURE BLACK LUXURY BG */
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      animation: fadeIn 0.8s ease forwards;
    }

    /* Logo */
    .loader-logo {
      width: 85px;
      filter: drop-shadow(0 0 12px rgba(255, 193, 7, 0.6));
      z-index: 3;
    }

    /* Gold Luxury Ring */
    .loader-ring {
      position: absolute;
      width: 160px;
      height: 160px;
      border: 3px solid transparent;
      border-top-color: #f7b500;
      border-right-color: #f7b500;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
      filter: drop-shadow(0 0 15px #f7b500);
    }

    /* Title Text */
    .load-text {
      margin-top: 25px;
      font-size: 14px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #f8f8f8;
      opacity: 0.7;
      animation: pulse 1.6s infinite alternate;
    }

    /* Smooth Page Exit */
    .page-transition {
      animation: exitPage 0.8s ease forwards;
      background: #000000;
    }

    /* Animations */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    /* Smooth slide + fade while leaving */
    @keyframes exitPage {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.94) translateY(-20px); }
    }
  </style>
</head>

<body>

  <!-- Loader -->
  <div id="loader">
    <div class="loader-ring"></div>
    <img src="white logo.png" class="loader-logo" alt="Logo" />
    <div class="load-text">Loading</div>
  </div>

  <script>
    // After 5 seconds → smooth transition → go to next page
    setTimeout(() => {
      document.body.classList.add("page-transition");

      setTimeout(() => {
        window.location.href = "index.html";
      }, 800); // smooth animation duration
    }, 3000); // loader time
  </script>

</body>
</html>
